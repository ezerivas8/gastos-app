<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Gastos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#F2F2F7;
  --bg-card:#FFFFFF;
  --bg-btn:#E5E5EA;
  --text:#000000;
  --text2:#3C3C43;
  --text3:#8E8E93;
  --separator:rgba(60,60,67,0.12);
  --blue:#007AFF;
  --green:#34C759;
  --green-bg:#E8F8EC;
  --amber:#FF9500;
  --amber-bg:#FFF3E0;
  --coral:#FF3B30;
  --coral-bg:#FFE5E4;
  --purple:#AF52DE;
  --purple-bg:#F5EAFC;
  --teal:#30B0C7;
  --teal-bg:#E5F6FA;
  --gray:#8E8E93;
  --radius:12px;
  --radius-lg:16px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}

/* HEADER */
.header{
  background:rgba(242,242,247,0.92);
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  border-bottom:0.5px solid var(--separator);
  padding:env(safe-area-inset-top,0) 0 0;
  position:sticky;top:0;z-index:20;
}
.header-inner{padding:16px 16px 14px;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.app-title{font-size:28px;font-weight:700;letter-spacing:-0.5px;color:var(--text);}

/* ONBOARDING */
.onboard-screen{
  position:fixed;inset:0;z-index:500;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:32px 24px;
  padding-top:calc(env(safe-area-inset-top,0) + 32px);
}
.onboard-title{
  font-size:34px;font-weight:700;
  letter-spacing:-0.8px;color:var(--text);
  text-align:center;margin-bottom:8px;
}
.onboard-sub{
  font-size:15px;color:var(--text3);
  text-align:center;margin-bottom:48px;
  text-transform:uppercase;letter-spacing:0.05em;
}
.onboard-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;width:100%;max-width:320px;
  margin-bottom:0;
}
.onboard-btn{
  height:80px;
  background:var(--bg-card);
  border:0.5px solid var(--separator);
  border-radius:var(--radius-lg);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  font-size:20px;font-weight:700;
  color:var(--text);
  cursor:pointer;
  letter-spacing:-0.3px;
  transition:all 0.1s;
  display:flex;align-items:center;justify-content:center;
}
.onboard-btn:active{background:var(--blue);color:#FFF;border-color:var(--blue);transform:scale(0.97);}

/* USER BADGE in header */
.user-badge{
  display:flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:999px;
  background:var(--blue);
  font-size:12px;font-weight:700;color:#FFF;
  letter-spacing:0.02em;cursor:pointer;
  text-transform:uppercase;
}

.sync-badge{
  display:flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:999px;
  background:var(--bg-card);border:0.5px solid var(--separator);
  font-size:12px;font-weight:500;color:var(--text2);
}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.sync-dot.syncing{background:var(--amber);animation:blink 0.8s infinite;}
.sync-dot.error{background:var(--coral);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.month-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;}
.month-btn{background:var(--bg-btn);border:none;border-radius:999px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--blue);font-size:16px;}
.month-btn:active{opacity:0.6;}
.month-label{font-size:17px;font-weight:600;letter-spacing:-0.3px;color:var(--text);min-width:130px;text-align:center;}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.total-card{background:var(--bg-card);border-radius:var(--radius);padding:14px 16px;}
.total-card .lbl{font-size:12px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;}
.total-card .val{font-size:24px;font-weight:700;letter-spacing:-0.5px;color:var(--text);}

/* FORM AREA */
.form-area{padding:16px 16px;display:flex;flex-direction:column;gap:12px;}
.group-label{font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;padding:0 4px 6px;}
.group{background:var(--bg-card);border-radius:var(--radius-lg);overflow:hidden;}
.btn-grid{display:grid;gap:0.5px;background:var(--separator);}
.btn-grid-3{grid-template-columns:repeat(3,1fr);}

.msg-input{
  width:100%;
  background:var(--bg-card);
  border:none;
  border-radius:var(--radius-lg);
  padding:14px 16px;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  font-size:16px;color:var(--text);
  outline:none;-webkit-appearance:none;
  text-transform:uppercase;
}
.msg-input::placeholder{color:var(--text3);text-transform:uppercase;}
.msg-input:focus{outline:none;}

.sel-btn{
  height:44px;border:none;background:var(--bg-card);
  color:var(--text2);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  font-size:13px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  text-transform:uppercase;letter-spacing:0.02em;
}
.sel-btn i{font-size:15px;}
.sel-btn:active{background:var(--bg);}
.sel-btn.active-super      {color:var(--green);  background:var(--green-bg);}
.sel-btn.active-comida     {color:var(--green);  background:var(--green-bg);}
.sel-btn.active-combustible{color:var(--amber);  background:var(--amber-bg);}
.sel-btn.active-salidas    {color:var(--purple); background:var(--purple-bg);}
.sel-btn.active-ropa       {color:var(--coral);  background:var(--coral-bg);}
.sel-btn.active-otros      {color:var(--text2);  background:var(--bg-btn);}
.sel-btn.active-efectivo   {color:var(--text);   background:var(--bg-btn);}
.sel-btn.active-debito     {color:var(--teal);   background:var(--teal-bg);}
.sel-btn.active-credito    {color:var(--blue);   background:#EAF3FF;}

.moneda-row{display:grid;grid-template-columns:1fr 1fr;gap:0.5px;background:var(--separator);}
.moneda-btn{
  height:44px;border:none;background:var(--bg-card);
  color:var(--text2);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  font-size:15px;font-weight:500;cursor:pointer;
  text-transform:uppercase;letter-spacing:0.02em;
  display:flex;align-items:center;justify-content:center;
}
.moneda-btn:active{background:var(--bg);}
.moneda-btn.active{color:var(--blue);font-weight:700;background:#EAF3FF;}

.tdc-row{
  background:var(--bg-card);border-radius:var(--radius-lg);
  padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.tdc-row label{font-size:15px;font-weight:500;color:var(--text);text-transform:uppercase;letter-spacing:0.02em;}
.tdc-input{
  width:72px;background:var(--bg-btn);border:none;border-radius:8px;
  padding:6px 10px;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  font-size:15px;font-weight:600;color:var(--blue);
  outline:none;text-align:center;-webkit-appearance:none;
}

/* SEND BUTTON — fixed bottom */
.send-wrap{
  padding:12px 16px calc(env(safe-area-inset-bottom,0) + 12px);
  background:rgba(242,242,247,0.95);
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  border-top:0.5px solid var(--separator);
  position:sticky;bottom:0;z-index:20;
}
.send-btn{
  width:100%;height:52px;
  background:var(--blue);color:#FFFFFF;
  border:none;border-radius:var(--radius-lg);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  font-size:17px;font-weight:600;
  cursor:pointer;
  text-transform:uppercase;letter-spacing:0.03em;
}
.send-btn:active{opacity:0.7;transform:scale(0.98);}

/* FILTER */
.filter-strip{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;background:var(--bg);}
.filter-strip::-webkit-scrollbar{display:none;}
.fpill{
  flex-shrink:0;padding:7px 16px;border-radius:999px;
  font-size:14px;font-weight:500;
  background:var(--bg-card);color:var(--text2);
  cursor:pointer;white-space:nowrap;
  text-transform:uppercase;letter-spacing:0.02em;border:none;
}
.fpill:active{opacity:0.7;}
.fpill.active{font-weight:700;}
.fpill-all.active        {background:var(--text);color:#FFF;}
.fpill-super.active      {background:var(--green);color:#FFF;}
.fpill-comida.active     {background:var(--green);color:#FFF;}
.fpill-combustible.active{background:var(--amber);color:#FFF;}
.fpill-salidas.active    {background:var(--purple);color:#FFF;}
.fpill-ropa.active       {background:var(--coral);color:#FFF;}
.fpill-otros.active      {background:var(--gray);color:#FFF;}

/* ITEMS */
.section-bar{padding:8px 16px 4px;display:flex;align-items:center;justify-content:space-between;}
.section-bar span{font-size:13px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;}

.items-wrap{margin:0 16px 32px;background:var(--separator);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;gap:0.5px;}
.item-card{
  background:var(--bg-card);
  padding:12px 16px;
  display:flex;align-items:center;gap:12px;
}
.item-del-btn{
  background:none;border:none;
  width:36px;height:36px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  color:var(--coral);font-size:20px;
  cursor:pointer;flex-shrink:0;
}
.item-del-btn:active{background:var(--coral-bg);}

/* Confirm overlay */
.confirm-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,0.4);
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.confirm-sheet{
  width:100%;
  background:var(--bg-card);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  padding:20px 16px 8px;
  display:flex;flex-direction:column;gap:8px;
}
.confirm-title{
  font-size:13px;font-weight:500;
  color:var(--text3);text-align:center;
  text-transform:uppercase;letter-spacing:0.05em;
  margin-bottom:4px;
}
.confirm-delete-btn{
  width:100%;height:52px;
  background:#FFE5E4;color:var(--coral);
  border:none;border-radius:var(--radius);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  font-size:17px;font-weight:600;
  cursor:pointer;text-transform:uppercase;letter-spacing:0.03em;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.confirm-delete-btn:active{opacity:0.7;}
.confirm-cancel-btn{
  width:100%;height:52px;
  background:var(--bg-btn);color:var(--text);
  border:none;border-radius:var(--radius);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  font-size:17px;font-weight:600;
  cursor:pointer;text-transform:uppercase;letter-spacing:0.03em;
  margin-bottom:8px;
}
.confirm-cancel-btn:active{opacity:0.7;}

.item-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.item-icon.super      {background:var(--green-bg); color:var(--green);}
.item-icon.comida     {background:var(--green-bg); color:var(--green);}
.item-icon.combustible{background:var(--amber-bg); color:var(--amber);}
.item-icon.salidas    {background:var(--purple-bg);color:var(--purple);}
.item-icon.ropa       {background:var(--coral-bg); color:var(--coral);}
.item-icon.otros      {background:var(--bg-btn);   color:var(--gray);}
.item-info{flex:1;min-width:0;}
.item-desc{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;}
.item-meta{font-size:13px;color:var(--text3);margin-top:2px;display:flex;align-items:center;gap:5px;}
.mbadge{font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:0.03em;}
.mbadge.efectivo{background:var(--bg-btn);color:var(--text2);}
.mbadge.debito  {background:var(--teal-bg);color:var(--teal);}
.mbadge.credito {background:#EAF3FF;color:var(--blue);}
.item-amt{text-align:right;flex-shrink:0;}
.item-amt .uyu{font-size:15px;font-weight:700;color:var(--text);}
.item-amt .usd{font-size:12px;color:var(--text3);margin-top:1px;}

.empty-state{text-align:center;padding:60px 24px;background:var(--bg-card);border-radius:var(--radius-lg);margin:0 16px;}
.empty-state i{font-size:44px;display:block;margin-bottom:12px;color:var(--separator);}
.empty-state p{font-size:15px;font-weight:500;text-transform:uppercase;color:var(--text3);}

/* TOAST */
.toast{
  position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0));
  left:50%;transform:translateX(-50%);
  padding:12px 22px;border-radius:999px;
  font-size:14px;font-weight:600;z-index:200;white-space:nowrap;
  text-transform:uppercase;letter-spacing:0.03em;
  animation:slideup 0.2s ease;
  box-shadow:0 4px 24px rgba(0,0,0,0.12);
}
@keyframes slideup{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast.success{background:rgba(52,199,89,0.15);color:var(--green);border:0.5px solid rgba(52,199,89,0.3);}
.toast.error  {background:rgba(255,59,48,0.12);color:var(--coral);border:0.5px solid rgba(255,59,48,0.25);}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
<div class="header-inner">
  <div class="header-top">
    <div class="app-title">GASTOS</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div class="user-badge" id="userBadge" onclick="resetUser()">EZE</div>
      <div class="sync-badge">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">SHEETS</span>
      </div>
    </div>
  </div>
  <div class="month-row">
    <button class="month-btn" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
    <span class="month-label" id="monthLabel">JUNIO 2026</span>
    <button class="month-btn" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
  </div>
  <div class="totals">
    <div class="total-card"><div class="lbl">TOTAL UYU</div><div class="val" id="totalUYU">$0</div></div>
    <div class="total-card"><div class="lbl">TOTAL USD</div><div class="val" id="totalUSD">$0</div></div>
  </div>
</div>
</div>

<!-- FORM -->
<div class="form-area">

  <div>
    <div class="group-label">DESCRIPCIÓN</div>
    <input class="msg-input" type="text" id="msgInput" placeholder="EJ: 300 EN TIENDA INGLESA" autocomplete="off" enterkeyhint="done"/>
  </div>

  <div>
    <div class="group-label">CATEGORÍA</div>
    <div class="group">
      <div class="btn-grid btn-grid-3">
        <button class="sel-btn active-super" id="cat-super"        onclick="selectCat('super')"><i class="ti ti-shopping-cart"></i>SUPER</button>
        <button class="sel-btn"              id="cat-comida"        onclick="selectCat('comida')"><i class="ti ti-tools-kitchen-2"></i>COMIDA</button>
        <button class="sel-btn"              id="cat-combustible"   onclick="selectCat('combustible')"><i class="ti ti-gas-station"></i>NAFTA</button>
      </div>
      <div class="btn-grid btn-grid-3">
        <button class="sel-btn"              id="cat-salidas"       onclick="selectCat('salidas')"><i class="ti ti-building-store"></i>SALIDAS</button>
        <button class="sel-btn"              id="cat-ropa"          onclick="selectCat('ropa')"><i class="ti ti-shirt"></i>ROPA</button>
        <button class="sel-btn"              id="cat-otros"         onclick="selectCat('otros')"><i class="ti ti-dots"></i>OTROS</button>
      </div>
    </div>
  </div>

  <div>
    <div class="group-label">MÉTODO DE PAGO</div>
    <div class="group">
      <div class="btn-grid btn-grid-3">
        <button class="sel-btn active-efectivo" id="met-efectivo" onclick="selectMet('efectivo')"><i class="ti ti-cash"></i>EFECTIVO</button>
        <button class="sel-btn"                 id="met-debito"   onclick="selectMet('debito')"><i class="ti ti-credit-card"></i>DÉBITO</button>
        <button class="sel-btn"                 id="met-credito"  onclick="selectMet('credito')"><i class="ti ti-credit-card"></i>CRÉDITO</button>
      </div>
    </div>
  </div>

  <div>
    <div class="group-label">MONEDA</div>
    <div class="group">
      <div class="moneda-row">
        <button class="moneda-btn active" id="mon-uyu" onclick="selectMoneda('uyu')">$ UYU</button>
        <button class="moneda-btn"        id="mon-usd" onclick="selectMoneda('usd')">U$S USD</button>
      </div>
    </div>
  </div>

  <div class="tdc-row">
    <label>TDC UYU/USD</label>
    <input class="tdc-input" type="number" id="tdcInput" value="40" min="1" step="0.5" oninput="renderItems()">
  </div>

</div>

<!-- SEND FIXED BOTTOM -->
<div class="send-wrap">
  <button class="send-btn" onclick="handleSend()">ENVIAR</button>
</div>

<!-- LIST -->
<div class="filter-strip">
  <button class="fpill fpill-all active"         onclick="setFilter('all')">TODOS</button>
  <button class="fpill fpill-super"              onclick="setFilter('super')">SUPER</button>
  <button class="fpill fpill-comida"             onclick="setFilter('comida')">COMIDA</button>
  <button class="fpill fpill-combustible"        onclick="setFilter('combustible')">NAFTA</button>
  <button class="fpill fpill-salidas"            onclick="setFilter('salidas')">SALIDAS</button>
  <button class="fpill fpill-ropa"               onclick="setFilter('ropa')">ROPA</button>
  <button class="fpill fpill-otros"              onclick="setFilter('otros')">OTROS</button>
</div>

<div class="section-bar"><span id="itemCount">0 GASTOS</span></div>
<div class="items-wrap" id="itemsList"></div>
<div id="emptyState" class="empty-state" style="display:none">
  <i class="ti ti-receipt-off"></i>
  <p>SIN GASTOS ESTE MES</p>
</div>


<!-- ONBOARDING -->
<div class="onboard-screen" id="onboardScreen">
  <div class="onboard-title">GASTOS</div>
  <div class="onboard-sub">¿QUIÉN SOS?</div>
  <div class="onboard-grid">
    <button class="onboard-btn" onclick="setUser('NATALIA')">NATALIA</button>
    <button class="onboard-btn" onclick="setUser('MARTIN')">MARTIN</button>
    <button class="onboard-btn" onclick="setUser('COTI')">COTI</button>
    <button class="onboard-btn" onclick="setUser('EZE')">EZE</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.9.0/jsrsasign-all-min.js"></script>
<script>

let curMonth=5,curYear=2026,activeFilter='all',selectedMet='efectivo',selectedCat='super',selectedMoneda='uyu';
let accessToken=null,tokenExpiry=0;

function mkey(y,m){return `gv_${y}_${m}`;}
function getData(){try{return JSON.parse(localStorage.getItem(mkey(curYear,curMonth))||'[]');}catch(e){return[];}}
function saveData(d){localStorage.setItem(mkey(curYear,curMonth),JSON.stringify(d));}

function setSyncStatus(s){
  document.getElementById('syncDot').className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');
  document.getElementById('syncLabel').textContent=s==='syncing'?'GUARDANDO...':s==='error'?'ERROR':'SHEETS ✓';
}
function showToast(msg,type='success'){
  const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2500);
}

async function getAccessToken(){
  if(accessToken&&Date.now()<tokenExpiry)return accessToken;
  try{
    const now=Math.floor(Date.now()/1000);
    const jwt=KJUR.jws.JWS.sign('RS256',JSON.stringify({alg:'RS256',typ:'JWT'}),
      JSON.stringify({iss:SA_EMAIL,scope:'https://www.googleapis.com/auth/spreadsheets',aud:'https://oauth2.googleapis.com/token',exp:now+3600,iat:now}),SA_KEY);
    const res=await fetch('https://oauth2.googleapis.com/token',{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:`grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${jwt}`
    });
    const d=await res.json();accessToken=d.access_token;tokenExpiry=Date.now()+(d.expires_in-60)*1000;
    return accessToken;
  }catch(e){return null;}
}

async function appendToSheets(row){
  try{
    setSyncStatus('syncing');
    const token=await getAccessToken();
    if(!token){setSyncStatus('error');return null;}
    const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/Hoja%201!A:J:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,{
      method:'POST',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({values:[row]})
    });
    if(!res.ok){setSyncStatus('error');return null;}
    const data=await res.json();
    // Extract row number from updatedRange e.g. "Hoja 1!A5:J5" -> 5
    const range=data.updates?.updatedRange||'';
    const match=range.match(/!A(\d+)/);
    const rowNum=match?parseInt(match[1]):null;
    setSyncStatus('ok');
    return rowNum;
  }catch(e){setSyncStatus('error');return null;}
}

async function deleteFromSheets(rowNum){
  try{
    const token=await getAccessToken();
    if(!token)return false;
    // Get spreadsheet ID to find sheet ID
    const metaRes=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}?fields=sheets.properties`,{
      headers:{'Authorization':'Bearer '+token}
    });
    const meta=await metaRes.json();
    const sheetId=meta.sheets?.find(s=>s.properties.title==='Hoja 1')?.properties?.sheetId??0;
    const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}:batchUpdate`,{
      method:'POST',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({requests:[{deleteDimension:{range:{sheetId,dimension:'ROWS',startIndex:rowNum-1,endIndex:rowNum}}}]})
    });
    return res.ok;
  }catch(e){return false;}
}

async function initSheets(){
  try{
    const token=await getAccessToken();
    if(!token){setSyncStatus('error');return;}
    const check=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/Hoja%201!A1`,{headers:{'Authorization':'Bearer '+token}});
    const d=await check.json();
    if(!d.values){
      await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/Hoja%201!A1:J1?valueInputOption=USER_ENTERED`,{
        method:'PUT',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
        body:JSON.stringify({values:[['FECHA','PERSONA','DESCRIPCIÓN','CATEGORÍA','MÉTODO','MONEDA','MONTO ORIG.','MONTO UYU','MONTO USD','TDC']]})
      });
    }
    setSyncStatus('ok');
  }catch(e){setSyncStatus('error');}
}

function selectCat(c){selectedCat=c;Object.keys(CATS).forEach(x=>{document.getElementById('cat-'+x).className='sel-btn'+(x===c?' active-'+x:'');});}
function selectMet(m){selectedMet=m;['efectivo','debito','credito'].forEach(x=>{document.getElementById('met-'+x).className='sel-btn'+(x===m?' active-'+x:'');});}
function selectMoneda(m){selectedMoneda=m;['uyu','usd'].forEach(x=>{document.getElementById('mon-'+x).className='moneda-btn'+(x===m?' active':'');});}

function changeMonth(d){
  curMonth+=d;
  if(curMonth>11){curMonth=0;curYear++;}
  if(curMonth<0){curMonth=11;curYear--;}
  document.getElementById('monthLabel').textContent=MONTHS[curMonth]+' '+curYear;
  renderItems();
}
function setFilter(f){
  activeFilter=f;
  document.querySelectorAll('.fpill').forEach(p=>p.classList.remove('active'));
  document.querySelector('.fpill-'+f).classList.add('active');
  renderItems();
}

async function handleSend(){
  const input=document.getElementById('msgInput');
  const text=input.value.trim();
  if(!text){showToast('ESCRIBÍ EL MONTO Y DESCRIPCIÓN','error');return;}
  const match=text.match(/(\d+[\.,]?\d*)/);
  if(!match){showToast('INCLUÍ EL MONTO EN EL TEXTO','error');return;}
  const rawAmt=parseFloat(match[1].replace(',','.'));
  if(!rawAmt||rawAmt<=0){showToast('MONTO INVÁLIDO','error');return;}
  input.value='';
  const tdc=parseFloat(document.getElementById('tdcInput').value)||40;
  const amtUYU=selectedMoneda==='usd'?Math.round(rawAmt*tdc):rawAmt;
  const amtUSD=selectedMoneda==='usd'?rawAmt:Math.round(rawAmt/tdc);
  const fecha=new Date().toLocaleDateString('es-UY');
  const desc=text.replace(/^\d+[\.,]?\d*\s*(pesos|uyu|\$|dolares|usd|u\$s)?\s*(en\s+)?/i,'').trim()||text;
  const item={id:Date.now(),desc:desc.toUpperCase(),cat:selectedCat,met:selectedMet,moneda:selectedMoneda,amtOrig:rawAmt,amt:amtUYU,date:fecha};
  const items=getData();items.push(item);saveData(items);
  renderItems();
  const rowNum=await appendToSheets([fecha,currentUser||'?',desc.toUpperCase(),CATS[selectedCat],MET_LABELS[selectedMet],selectedMoneda.toUpperCase(),rawAmt,amtUYU,amtUSD,tdc]);
  if(rowNum){
    // Save row number so we can delete it later
    const updatedItems=getData();
    const last=updatedItems[updatedItems.length-1];
    if(last&&last.id===item.id){last.sheetRow=rowNum;saveData(updatedItems);}
  }
  showToast(rowNum?'✓ GUARDADO EN SHEETS':'GUARDADO LOCALMENTE',rowNum?'success':'error');
}

async function deleteItem(id){
  const items=getData();
  const item=items.find(i=>i.id===id);
  saveData(items.filter(i=>i.id!==id));
  renderItems();
  if(item&&item.sheetRow){
    const deleted=await deleteFromSheets(item.sheetRow);
    if(deleted) showToast('✓ ELIMINADO DE SHEETS','success');
    else showToast('ELIMINADO LOCALMENTE','error');
  }
}

function renderItems(){
  const tdc=parseFloat(document.getElementById('tdcInput').value)||40;
  const items=getData();
  const filtered=activeFilter==='all'?items:items.filter(i=>i.cat===activeFilter);
  const grand=items.reduce((a,i)=>a+i.amt,0);
  document.getElementById('totalUYU').textContent='$'+Math.round(grand).toLocaleString('es-UY');
  document.getElementById('totalUSD').textContent='$'+Math.round(grand/tdc).toLocaleString('es-UY');
  document.getElementById('itemCount').textContent=filtered.length+' GASTO'+(filtered.length!==1?'S':'');
  const list=document.getElementById('itemsList');
  const empty=document.getElementById('emptyState');
  if(!filtered.length){
    list.innerHTML='';empty.style.display='block';
    empty.querySelector('p').textContent=activeFilter==='all'?'SIN GASTOS ESTE MES':'SIN GASTOS EN ESTA CATEGORÍA';
    return;
  }
  empty.style.display='none';
  list.innerHTML=[...filtered].reverse().map(i=>`
    <div class="item-card" id="card-${i.id}">
      <div class="item-icon ${i.cat}"><i class="ti ${CAT_ICONS[i.cat]||'ti-dots'}"></i></div>
        <div class="item-info">
          <div class="item-desc">${i.desc}</div>
          <div class="item-meta">
            <span class="mbadge ${i.met}">${MET_LABELS[i.met]||i.met}</span>
            <span>${i.date||''}</span>
          </div>
        </div>
        <div class="item-amt">
          <div class="uyu">$${Math.round(i.amt).toLocaleString('es-UY')}</div>
          <div class="usd">≈ USD ${Math.round(i.amt/tdc)}</div>
        </div>
        <button class="item-del-btn" onclick="confirmDelete(${i.id})">
          <svg width="22" height="22" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- lid handle -->
            <rect x="42" y="6" width="16" height="8" rx="4" fill="#FF3B30"/>
            <!-- lid -->
            <path d="M18 20 Q50 14 82 20 L78 30 Q50 24 22 30 Z" fill="#FF3B30"/>
            <!-- body -->
            <rect x="22" y="32" width="56" height="58" rx="6" fill="#FF3B30"/>
            <!-- lines -->
            <rect x="36" y="42" width="6" height="36" rx="3" fill="white"/>
            <rect x="47" y="42" width="6" height="36" rx="3" fill="white"/>
            <rect x="58" y="42" width="6" height="36" rx="3" fill="white"/>
          </svg>
        </button>
    </div>`).join('');

}

  } else {
    document.getElementById('onboardScreen').style.display = 'flex';
  }
}
